name: Build Android APK

# Builds the Capacitor-wrapped web app into ONE signed, universal Android APK.
# "Universal" means a single APK that installs on every architecture (arm64,
# armv7, x86_64): the web bundle carries no native code, so no ABI split is
# produced. Only this one APK is built - there is no separate debug artifact.
#
# On a tag push (v*) the signed APK is attached to the GitHub Release, which
# gives a permanent, always-available download URL:
#   https://github.com/<owner>/<repo>/releases/latest/download/app-release.apk
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release.keystore (PKCS12/JKS)
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          key alias (defaults to "openhands")
#
# Optional repository variable:
#   BACKEND_BASE_URL           baked into the web bundle as VITE_BACKEND_BASE_URL
#   SIGNING_CERT_SHA256        pins the signer fingerprint (see SIGNING.md)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "OpenHands-main/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OpenHands-main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: OpenHands-main/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor toolchain
        # The Capacitor packages are not in package.json; install them at the
        # same major version the android/ project was generated with.
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web bundle
        env:
          # This build is STANDALONE by default: the local runtime answers REST
          # and the conversation socket in-process and calls the user's own LLM
          # provider, so the phone needs no agent server at all. Set the repo
          # variable STANDALONE_MODE to "false" to ship the server-backed build.
          VITE_MOCK_API: ${{ vars.STANDALONE_MODE == 'false' && 'false' || 'true' }}
          # Public URL of the OpenHands agent server the phone talks to. Only
          # used by the server-backed build; standalone ignores it.
          VITE_BACKEND_BASE_URL: ${{ vars.STANDALONE_MODE == 'false' && vars.BACKEND_BASE_URL || '' }}
          # Cloud lock only applies to the server-backed build. Locking the
          # standalone build to hosted Cloud would put a login page in front of
          # an app that has no server to log in to. Set CLOUD_BASE_URL to a
          # self-hosted origin to point the server-backed build elsewhere, or to
          # "off" to ship it unlocked (backend form on first launch).
          VITE_LOCK_TO_CLOUD: ${{ vars.STANDALONE_MODE == 'false' && (vars.CLOUD_BASE_URL == 'off' && '' || vars.CLOUD_BASE_URL || 'https://app.all-hands.dev') || '' }}
          # The README and the landing page promise "no telemetry". Upstream's
          # default sends an anonymous install event before any consent, so
          # turn the PostHog client off at build time to make the promise true.
          VITE_DO_NOT_TRACK: "1"
        run: npm run build:app

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore release keystore
        id: keystore
        # Never on a pull_request run. A same-repo PR could otherwise build with
        # the real release key, and the key would be present in the workspace of
        # a workflow triggered by unreviewed code. Tag and main runs still sign.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Without the secret the build is unsigned, so it must never be
            # published. The publish step below is gated on this output, which
            # keeps a branch/PR run green while still refusing to ship an
            # unsigned APK.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be UNSIGNED and will not be published."
            echo "::warning::Add the signing secrets (see README, section 'Signing') to publish releases."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "keystore restored: $(wc -c < android/app/release.keystore) bytes"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the universal release APK
        working-directory: OpenHands-main/android
        env:
          OPENHANDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENHANDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OPENHANDS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          # assembleRelease produces the single universal APK. ABI splits are
          # disabled in app/build.gradle, so this is the only output.
          ./gradlew assembleRelease --no-daemon

      - name: Verify the release APK
        id: verify
        working-directory: OpenHands-main/android
        env:
          KEYSTORE_WAS_RESTORED: ${{ steps.keystore.outputs.signed }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi

          # There must be exactly one APK: a universal build, not per-ABI splits.
          COUNT=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected exactly one universal APK, found $COUNT"
            ls -l app/build/outputs/apk/release/*.apk
            exit 1
          fi
          echo "apk: $APK"

          # apksigner is a shell wrapper that execs `java`, so the JDK has to be
          # on PATH - JAVA_HOME alone is not enough and the check silently fails.
          export PATH="$JAVA_HOME/bin:$PATH"

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)

          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "^package|^native-code" || true
          fi

          certs=""
          if [ -n "$APKSIGNER" ]; then
            certs=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          fi
          if ! printf '%s' "$certs" | grep -q "Signer #1"; then
            # keytool also reads a v1-signed APK, so use it as a fallback.
            certs=$(keytool -printcert -jarfile "$APK" 2>&1 || true)
          fi
          printf '%s\n' "$certs" |
            grep -E "Signer #1 certificate (DN|SHA-256)|^Certificate fingerprints|SHA256:" || true

          if printf '%s' "$certs" | grep -qE "Signer #1 certificate|SHA256:"; then
            echo "release APK is signed"
          elif [ "$KEYSTORE_WAS_RESTORED" = "true" ]; then
            echo "::error::the keystore was restored but the release APK is not signed"
            exit 1
          else
            echo "::warning::release APK is UNSIGNED (no keystore secret) - not publishable"
          fi

          # The signing key must never change. Two APKs signed with different
          # keys are different apps to Android, so a rotated key forces every
          # user to uninstall first. Set the SIGNING_CERT_SHA256 repository
          # variable to the fingerprint of your keystore and this step refuses
          # to publish anything else. The fingerprint is public - it ships
          # inside every APK - so it is safe to keep in the repository.
          EXPECTED="${{ vars.SIGNING_CERT_SHA256 }}"

          if [ "$KEYSTORE_WAS_RESTORED" = "true" ]; then
            # apksigner prints the digest as bare hex, keytool as hex separated
            # by colons. Accept either, then normalise to the colons form.
            RAW=$(printf '%s' "$certs" | grep -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{64}' | head -1)
            if [ -z "$RAW" ]; then
              echo "::error::could not read the signer fingerprint from the APK"
              exit 1
            fi
            ACTUAL=$(printf '%s' "$RAW" | tr -d ':' | tr 'a-f' 'A-F' | sed 's/\(..\)/\1:/g; s/:$//')
            echo "signer fingerprint : $ACTUAL"
            if [ -z "$EXPECTED" ]; then
              echo "::warning::SIGNING_CERT_SHA256 is not set - the fingerprint above was NOT enforced."
              echo "::warning::Set the SIGNING_CERT_SHA256 repository variable to this value so future updates install in place."
            else
              echo "expected fingerprint: $EXPECTED"
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::SIGNING KEY CHANGED. The APK is signed with a different key than the pinned fingerprint. Publishing this would force every existing user to uninstall. If the rotation is intentional, update SIGNING.md and set the SIGNING_CERT_SHA256 repository variable."
                exit 1
              fi
              echo "signing key matches the pinned fingerprint - in-place updates stay possible"
            fi
          fi

          sha256sum "$APK"
          ls -l "$APK"

          # Hand the real path to the upload step. A pull-request build has no
          # keystore, so Gradle names its output app-release-unsigned.apk and a
          # hardcoded path would miss it.
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload the universal APK
        if: steps.keystore.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openhands-universal-apk
          path: OpenHands-main/android/${{ steps.verify.outputs.apk }}
          if-no-files-found: error

      - name: Attach the APK to the GitHub Release
        # Only a signed APK is published, and only from a v* tag. Gating on
        # `signed` means an unsigned APK can never be published, however the
        # workflow is triggered.
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c %s "$APK")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          CERT="${SIGNING_CERT_SHA256:-unknown}"
          # printf, not a heredoc: a heredoc body would inherit this step's YAML
          # indentation and render as a code block on the release page.
          printf '%s\n' \
            'Android build of the OpenHands Agent Canvas UI, packaged with Capacitor.' \
            '' \
            '**One universal APK.** A single file for every phone - arm64, armv7 and' \
            'x86_64. The web bundle carries no native code, so there is nothing to' \
            'split per architecture. Signed with the project release key, so it' \
            'installs in place over any later build.' \
            '' \
            '**Standalone.** The agent runtime runs on the phone and talks straight' \
            'to the LLM provider you choose. There is no server to run and no account' \
            'to create.' \
            '' \
            '**Install**' \
            '1. Allow install from unknown sources for your browser or file manager.' \
            '2. Open the APK on the phone and install it.' \
            '3. On first launch, pick an agent, then a model and paste your LLM' \
            '   provider API key. Everything stays on the device.' \
            '' \
            '**Verify the download**' \
            '' \
            '| | |' \
            '| --- | --- |' \
            '| File | `app-release.apk` |' \
            "| Size | $SIZE bytes |" \
            "| SHA-256 | \`$SHA256\` |" \
            "| MD5 | \`$MD5\` |" \
            "| Signer cert SHA-256 | \`$CERT\` |" \
            '' \
            '```bash' \
            'sha256sum app-release.apk' \
            'apksigner verify --print-certs app-release.apk' \
            '```' \
            '' \
            'The signer fingerprint never changes between releases, which is what' \
            'lets a new build install straight over an old one.' \
            '' \
            'This release was produced by an AI agent (OpenHands) on behalf of the repository owner.' \
            > /tmp/notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "OpenHands Mobile $TAG" \
            --notes-file /tmp/notes.md
          gh release upload "$TAG" \
            "$APK#app-release.apk" \
            --clobber
