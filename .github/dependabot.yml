version: 2
updates:
  # The npm dependencies build the JS bundle that ships inside the APK.
  - package-ecosystem: npm
    directory: /agentdeck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  # The Android build inputs. These affect the APK we ship, so they are worth
  # tracking: the Gradle wrapper and the Android Gradle Plugin are what
  # assemble the release.
  - package-ecosystem: gradle
    directory: /agentdeck/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
