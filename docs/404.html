<style>
:root{
  --bg:#08080A;--surface:#111116;--surface-2:#17171F;--border:#22222B;
  --text:#F2F2F5;--text-muted:#A6A6B4;--accent:#7C8CFF;--accent-2:#3DDC97;
  --radius:16px;
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--font-sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;align-items:center;justify-content:center;
  padding:32px 20px;position:relative;overflow-x:hidden;
}
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.atmos-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.055) 1px,transparent 0);
  background-size:32px 32px;
  -webkit-mask-image:radial-gradient(120% 100% at 50% 0%,#000 30%,transparent 75%);
  mask-image:radial-gradient(120% 100% at 50% 0%,#000 30%,transparent 75%);
}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.glow.a{width:640px;height:640px;left:-8%;top:-12%;background:radial-gradient(circle,rgba(124,140,255,.55),transparent 68%)}
.glow.b{width:560px;height:560px;right:-8%;bottom:-14%;background:radial-gradient(circle,rgba(61,220,151,.38),transparent 68%)}
main{position:relative;z-index:1;max-width:640px;width:100%;text-align:center}
.badge{
  display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;
  border:1px solid var(--border);background:rgba(17,17,22,.72);margin-bottom:28px;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);font-weight:600;
}
.badge .dot{width:8px;height:8px;border-radius:99px;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.code{
  font-family:var(--font-mono);font-size:clamp(76px,18vw,132px);font-weight:500;line-height:1;
  letter-spacing:-.04em;margin:0 0 8px;
  background:linear-gradient(120deg,var(--text) 0%,var(--accent) 60%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
p.sub{color:var(--text-muted);font-size:17px;margin:0 auto 34px;max-width:46ch}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
a.btn{
  display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:14px;
  font-weight:600;font-size:15px;text-decoration:none;color:var(--text);
  border:1px solid var(--border);background:var(--surface);
  transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .2s,background .2s;
}
a.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
a.btn.primary{
  background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#08080A;border-color:transparent;
  box-shadow:0 14px 44px rgba(124,140,255,.34);
}
a.btn.primary:hover{filter:brightness(1.06)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.foot{margin-top:40px;font-size:13px;color:var(--text-muted)}
.foot a{color:var(--text-muted);text-decoration:underline;text-underline-offset:3px}
.foot a:hover{color:var(--text)}
</style>
</head>
<body>

  <div class="glow b"></div>
</div>

  </div>
  <p class="foot">OpenHands Mobile · <a href="https://github.com/NETO-DEV66/Opanhand-mobile-">NETO-DEV66/Opanhand-mobile-</a></p>
</main>
</body>
</html>
